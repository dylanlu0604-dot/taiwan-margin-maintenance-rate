name: Update market data

on:
  schedule:
    # 18:00 / 20:00 / 22:00 Asia/Taipei = 10:00 / 12:00 / 14:00 UTC
    - cron: "0 10,12,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update CSV
        run: python scripts/update_data.py --days 3

      - name: Update TWSE all-market keep rate
        run: python scripts/update_keep_rate.py

      - name: Commit CSV changes
        run: |
          if git diff --quiet -- data/margin_maintenance.csv data/twse_all_market_keep_rate.csv && [ -z "$(git status --porcelain -- data/twse_all_market_keep_rate.csv)" ]; then
            echo "No CSV changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin_maintenance.csv data/twse_all_market_keep_rate.csv
          git commit -m "Update market data"
          git push
