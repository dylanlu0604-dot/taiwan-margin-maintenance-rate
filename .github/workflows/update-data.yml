name: Update market data

on:
  schedule:
    # 19:00 Asia/Taipei = 09:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update CSV
        run: python scripts/update_data.py --days 3

      - name: Commit CSV changes
        run: |
          if git diff --quiet -- data/margin_maintenance.csv; then
            echo "No CSV changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin_maintenance.csv
          git commit -m "Update market data"
          git push
